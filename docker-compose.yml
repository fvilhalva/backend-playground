version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: backend-playground-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: backend-playground-rabbitmq
    ports:
      - "5672:5672" # protocolo AMQP, usado pela aplicação
      - "15672:15672" # painel de administração (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  postgres:
    image: postgres:16-alpine
    container_name: backend-playground-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: playground
      POSTGRES_PASSWORD: playground
      POSTGRES_DB: backend_playground
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  redis-data:
  rabbitmq-data:
  postgres-data:
